{% extends "base.html" %}

{% block title %}{{ product.name }} | Nitol{% endblock %}

{% block content %}

<div class="max-w-6xl mx-auto px-4 py-10">

  <div class="grid md:grid-cols-2 gap-8 items-center">
<!-- LEFT: IMAGE -->
<div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md p-4">
  <img 
    src="{{ product.image.url }}" 
    alt="{{ product.name }}"
    class="w-full h-[350px] object-cover rounded-xl">
    </div>

    <!-- RIGHT: DETAILS -->
    <div class="space-y-4">

    <!-- Category -->
    <span class="inline-block bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 text-xs px-3 py-1 rounded-full">
        {{ product.category.name }}
    </span>

    <!-- Title -->
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">
        {{ product.name }}
    </h1>

    <!-- Price -->
    <p class="text-2xl font-bold text-green-600">
        ৳{{ product.price }}
    </p>

    <!-- Description -->
    <p class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed">
        {{ product.description|default:"No description available for this product." }}
    </p>

    <!-- Buttons -->
    <div class="flex gap-3 pt-4">

        <button class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg transition">
        Add to Cart
        </button>

    </div>

    </div>

  </div>

</div>

{% endblock %}
