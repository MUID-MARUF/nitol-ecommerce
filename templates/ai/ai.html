{% extends "base.html" %}

{% block title %}AI Assistant | Nitol{% endblock %}

{% block content %}

<div class="h-[90vh] flex items-center justify-center bg-gray-100 dark:bg-gray-900 transition">

  <div class="w-full max-w-4xl h-full md:h-[85vh] flex flex-col bg-white dark:bg-gray-800 shadow-2xl rounded-2xl overflow-hidden">

<!-- Header -->
<div class="bg-green-600 text-white px-5 py-4 flex items-center justify-between">
  <h2 class="text-lg font-semibold flex items-center gap-2">
    🌿 Nitol AI Assistant
  </h2>
  <span class="text-sm opacity-80">● Online</span>
</div>

<!-- Chat Area -->
<div id="chat-box"
     class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50 dark:bg-gray-900">

  <!-- AI Message -->
  <div class="flex items-start gap-2">
    <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white text-sm">
      AI
    </div>
    <div class="bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 p-3 rounded-xl shadow max-w-[75%]">
      Hello! How can I help you today? 😊
    </div>
  </div>

  <!-- User Message -->
  <div class="flex justify-end items-start gap-2">
    <div class="bg-green-600 text-white p-3 rounded-xl shadow max-w-[75%]">
      Show me skincare products
    </div>
    <div class="w-8 h-8 rounded-full bg-gray-300 dark:bg-gray-600 flex items-center justify-center text-sm">
      You
    </div>
  </div>

  <!-- AI Response -->
  <div class="flex items-start gap-2">
    <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white text-sm">
      AI
    </div>
    <div class="bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 p-3 rounded-xl shadow max-w-[75%]">
      Sure! Here are some natural skincare products for you.
    </div>
  </div>

</div>

<!-- Input Area -->
<form class="p-4 border-t border-gray-200 dark:border-gray-700 flex items-center gap-2 bg-white dark:bg-gray-800">

  <input
    type="text"
    placeholder="Ask Nitol AI..."
    class="flex-1 px-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500"
  />

  <button
    type="submit"
    class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-full transition font-medium"
  >
    ➤
  </button>

</form>

  </div>

</div>

{% endblock %}
