{% extends "base.html" %}

{% block title %}Edit Profile | Nitol{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto px-4">

  <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md">

<h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white">
  Edit Profile
</h2>

<form method="POST" enctype="multipart/form-data" class="space-y-5">
  {% csrf_token %}

  <!-- Profile Image -->
  <div class="flex items-center gap-6">
    <div class="w-20 h-20 rounded-full overflow-hidden border">
      {% if user.profile.image %}
        <img src="{{ user.profile.image.url }}" class="w-full h-full object-cover">
      {% else %}
        <img src="https://ui-avatars.com/api/?name={{ user.username }}" class="w-full h-full">
      {% endif %}
    </div>

    <input type="file" name="image"
      class="text-sm text-gray-600 dark:text-gray-300">
  </div>

  <!-- Name -->
  <div>
    <label class="block mb-1 text-sm">Full Name</label>
    <input type="text" name="name" value="{{ user.first_name }}"
      class="w-full border rounded-lg px-4 py-2 dark:bg-gray-700 dark:text-white">
  </div>

  <!-- Email -->
  <div>
    <label class="block mb-1 text-sm">Email</label>
    <input type="email" name="email" value="{{ user.email }}"
      class="w-full border rounded-lg px-4 py-2 dark:bg-gray-700 dark:text-white">
  </div>

  <!-- Phone -->
  <div>
    <label class="block mb-1 text-sm">Phone</label>
    <input type="text" name="phone" value="{{ user.profile.phone }}"
      class="w-full border rounded-lg px-4 py-2 dark:bg-gray-700 dark:text-white">
  </div>

  <!-- Address -->
  <div>
    <label class="block mb-1 text-sm">Address</label>
    <input type="text" name="address" value="{{ user.profile.address }}"
      class="w-full border rounded-lg px-4 py-2 dark:bg-gray-700 dark:text-white">
  </div>

  <!-- Submit -->
  <button type="submit"
    class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
    Save Changes
  </button>

</form>

  </div>

</div>

{% endblock %}
