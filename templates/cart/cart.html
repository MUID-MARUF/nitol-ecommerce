{% extends "base.html" %}

{% block title %}Cart | Nitol{% endblock %}

{% block content %}

<div class="max-w-6xl mx-auto">

  <h1 class="text-2xl font-bold mb-6">Shopping Cart 🛒</h1>

  <div class="grid lg:grid-cols-3 gap-6">

    <!-- LEFT: CART ITEMS -->
    <div class="lg:col-span-2 space-y-4">

      <!-- Cart Item -->
      <div class="flex items-center bg-white p-4 rounded-xl shadow-md gap-4">

        <!-- Image -->
        <img src="https://via.placeholder.com/100"
             class="w-24 h-24 object-cover rounded-lg" />

        <!-- Info -->
        <div class="flex-1">
          <h2 class="font-semibold">Organic Face Cream</h2>
          <p class="text-sm text-gray-500">Skincare</p>

          <!-- Quantity -->
          <div class="flex items-center gap-2 mt-2">
            <button class="px-2 bg-gray-200 rounded">-</button>
            <span>1</span>
            <button class="px-2 bg-gray-200 rounded">+</button>
          </div>
        </div>

        <!-- Price -->
        <div class="text-right">
          <p class="font-bold text-green-600">৳499</p>
          <button class="text-red-500 text-sm mt-2 hover:underline">
            Remove
          </button>
        </div>

      </div>

      <!-- Repeat Item -->
      <div class="flex items-center bg-white p-4 rounded-xl shadow-md gap-4">

        <img src="https://via.placeholder.com/100"
             class="w-24 h-24 object-cover rounded-lg" />

        <div class="flex-1">
          <h2 class="font-semibold">Herbal Shampoo</h2>
          <p class="text-sm text-gray-500">Hair Care</p>

          <div class="flex items-center gap-2 mt-2">
            <button class="px-2 bg-gray-200 rounded">-</button>
            <span>2</span>
            <button class="px-2 bg-gray-200 rounded">+</button>
          </div>
        </div>

        <div class="text-right">
          <p class="font-bold text-green-600">৳799</p>
          <button class="text-red-500 text-sm mt-2 hover:underline">
            Remove
          </button>
        </div>

      </div>

    </div>

    <!-- RIGHT: SUMMARY -->
    <div class="bg-white p-6 rounded-xl shadow-md h-fit">

      <h2 class="text-lg font-semibold mb-4">Order Summary</h2>

      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span>৳1298</span>
        </div>

        <div class="flex justify-between">
          <span>Shipping</span>
          <span class="text-green-600">Free</span>
        </div>

        <div class="flex justify-between border-t pt-2 font-bold text-base">
          <span>Total</span>
          <span>৳1298</span>
        </div>
      </div>

      <button
        class="w-full mt-6 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
        Proceed to Checkout
      </button>

    </div>

  </div>

</div>

{% endblock %}
