{% load static %} {% load tailwind_tags %}

<!-- 
  Sticky & Glassmorphism classes applied:
  - sticky top-0 z-50: Locks the navbar to the top of the viewport above other elements.
  - bg-white/75: 75% opacity white background allows underneath content to tint through.
  - backdrop-blur-md: Applies the frosty glass blur effect to whatever passes underneath.
  - border-b border-white/20: Subtly defines the edge of the glass panel.
-->
<nav
  class="sticky top-0 z-50 w-full bg-white/75 backdrop-blur-md border-b border-white/20 shadow-sm transition-all duration-300 dark:bg-gray-800/75 dark:border-gray-700/20"
>
  <div
    class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20"
  >
    <!-- Logo & Brand Info Column -->
    <div class="flex items-center space-x-4 justify-center">
      <a
        href="/"
        class="flex items-center justify-center transition-transform duration-200 hover:scale-105"
      >
        <!-- Enlarged logo image for visibility -->
        <img
          class="w-10 h-10 object-contain"
          src="{% static 'images/logo.png' %}"
          alt="Logo"
        />
      </a>
      <div class="flex flex-col justify-center">
        <!-- Logo Text with slight padding adjustment instead of solid background box -->
        <p
          class="font-bold text-lg text-slate-800 dark:text-amber-500 tracking-wide"
        >
          Nitol <span class="text-amber-600 dark:text-white">Naturals</span>
        </p>
        <p class="text-xs text-slate-500 font-medium dark:text-teal-100">
          Embrace yourself with nature.
        </p>
      </div>
    </div>

    <!-- Navigation Menu Items -->
    <ul
      class="hidden md:flex items-center justify-right space-x-8 text-sm font-semibold text-slate-600 dark:text-gray-200"
    >
      <li>
        <a
          href="/"
          class="hover:text-amber-600 transition-colors duration-200 py-2"
          >Home</a
        >
      </li>
      <li>
        <a
          href="/products/"
          class="hover:text-amber-600 transition-colors duration-200 py-2"
          >Products</a
        >
      </li>
      <li>
        <a
          href="/ai/"
          class="hover:text-amber-600 transition-colors duration-200 py-2 flex items-center gap-1"
        >
          AI Assistant
          <span
            class="inline-flex items-center rounded-md bg-amber-50 px-1.5 py-0.5 text-xs font-medium text-amber-700 ring-1 ring-inset ring-amber-600/10"
            >New</span
          >
        </a>
      </li>
      <li>
        <a
          href="/contact/"
          class="hover:text-amber-600 transition-colors duration-200 py-2"
          >Contact Us</a
        >
      </li>
      <li>
        <a
          href="/about/"
          class="hover:text-amber-600 transition-colors duration-200 py-2"
          >About</a
        >
      </li>
      <li>
        <!-- Call to Action button for Login/Signup inside the glass pane -->
        <a
          href="/signup/"
          class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-full transition-all duration-200 shadow-sm hover:shadow"
        >
          Login / Signup
        </a>
      </li>
    </ul>
  </div>
</nav>
