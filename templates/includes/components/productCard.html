{% load static %}
<div
  class="max-w-sm mx-auto bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition duration-300"
>
  <!-- Product Image -->
  <div class="relative">
    <img
      src="{% static 'images/facewash.jpg' %}"
      alt="Product Image"
      class="w-full h-64 object-cover"
    />

    <!-- Badge -->
    <span
      class="absolute top-3 left-3 bg-green-500 text-white text-xs px-3 py-1 rounded-full"
    >
      New
    </span>
  </div>

  <!-- Content -->
  <div class="p-5">
    <!-- Title -->
    <h2 class="text-lg font-semibold text-gray-800 mb-1">Organic Face Cream</h2>

    <!-- Category -->
    <p class="text-sm text-gray-500 mb-3">Skincare • Natural</p>

    <!-- Price -->
    <div class="flex items-center justify-between mb-4">
      <span class="text-xl font-bold text-green-600"> ৳499 </span>
      <span class="text-sm text-gray-400 line-through"> ৳699 </span>
    </div>

    <!-- Buttons -->
    <div class="flex gap-2">
      <button
        class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition"
      >
        Add to Cart
      </button>
      <button class="px-3 py-2 border rounded-lg hover:bg-gray-100 transition">
        ❤️
      </button>
    </div>
  </div>
</div>
