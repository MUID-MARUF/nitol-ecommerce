<a href="/product/{{ product.id }}/" 
   class="block w-full max-w-xs mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-300">

  <!-- Image -->
  <div class="relative">
    <img
      src="{{ product.image.url }}"
      alt="{{ product.name }}"
      class="w-full h-44 object-cover"
    />

    <!-- Category badge -->
    <span class="absolute top-2 left-2 bg-green-500 text-white text-[10px] px-2 py-0.5 rounded-full">
      {{ product.category.name }}
    </span>
  </div>

  <!-- Content -->
  <div class="p-3">

    <!-- Title -->
    <h2 class="text-sm font-semibold text-gray-800 dark:text-white line-clamp-1">
      {{ product.name }}
    </h2>

    <!-- Price -->
    <p class="text-green-600 font-bold text-sm mt-1">
      ৳{{ product.price }}
    </p>

    <!-- Button -->
    <div class="mt-3">
      <button
        onclick="window.location.href='{% url 'add_to_cart' product.id %}'"
        class="w-full bg-green-600 text-white py-1.5 rounded-md hover:bg-green-700 transition text-xs">
        Add to Cart
      </button>
    </div>

  </div>

</a>
