<form method="GET" action="/products/" class="mt-4 max-w-xs mx-auto" role="search">
    <div
        class="flex items-center gap-2.5 px-3 py-2.5 relative rounded-full bg-white dark:bg-neutral-800 outline-1 -outline-offset-1 outline-slate-300 dark:outline-neutral-700 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-blue-600">
        
        <label for="search" class="sr-only">Search</label>
        
        <input 
            type="search" 
            name="q"
            id="search"
            placeholder="Search product..." 
            value="{{ request.GET.q }}"
            required
            class="text-sm text-slate-900 dark:text-slate-50 w-full outline-none pr-10 bg-transparent" 
        />

        <button 
            type="submit"
            aria-label="Search"
            class="absolute right-0 h-full px-3 flex items-center justify-center bg-blue-600 hover:bg-blue-700 rounded-r-full transition"
        >
            <!-- Clean SVG icon -->
            <svg xmlns="http://www.w3.org/2000/svg" 
                 class="w-4 h-4 text-white" 
                 fill="none" 
                 viewBox="0 0 24 24" 
                 stroke="currentColor" 
                 stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" 
                      d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </button>
    </div>
</form>
